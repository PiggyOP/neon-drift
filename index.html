<!doctype html><title>NEON DRIFT</title><style>body{margin:0;background:#050918;display:grid;place-items:center;height:100vh}canvas{width:min(96vw,96vh);height:min(96vw,96vh)}</style><canvas id=c width=600 height=600></canvas><script>
x=c.getContext('2d');last=0;k={};onkeydown=e=>{k[e.key.toLowerCase()]=1;if(e.key.includes('Arrow')||e.key==' ')e.preventDefault();if(e.key==' '&&g)reset()};onkeyup=e=>k[e.key.toLowerCase()]=0;onblur=()=>k={};r=()=>30+Math.random()*540;best=0;function reset(){p=[300,300];v=[0,0];en=[];gem=[r(),r()];t=score=0;g=0}reset();g=1;function text(s,y,n=20){x.fillStyle='#e8faff';x.font=n+'px monospace';x.textAlign='center';x.fillText(s,300,y)}function dot(a,b,r,col){x.shadowColor=x.fillStyle=col;x.shadowBlur=16;x.beginPath();x.arc(a,b,r,0,7);x.fill();x.shadowBlur=0}function loop(now=0){requestAnimationFrame(loop);if(now-last<16.67)return;last=now-(now-last)%16.67;x.fillStyle='#05091840';x.fillRect(0,0,600,600);x.strokeStyle='#10203b';x.lineWidth=1;for(i=0;i<600;i+=40){x.beginPath();x.moveTo(i,0);x.lineTo(i,600);x.moveTo(0,i);x.lineTo(600,i);x.stroke()}if(!g){t++;for(i=0;i<2;i++){v[i]=v[i]*.86+((k[i?'s':'d']||k[i?'arrowdown':'arrowright']||0)-(k[i?'w':'a']||k[i?'arrowup':'arrowleft']||0))*.65;p[i]=Math.max(12,Math.min(588,p[i]+v[i]))}if(t%Math.max(30,110-(t/150|0))==1){a=Math.random()*6.28;en.push([300+420*Math.cos(a),300+420*Math.sin(a)])}for(a of en){d=Math.hypot(p[0]-a[0],p[1]-a[1])||1;a[0]+=(p[0]-a[0])/d*(1+t/4000);a[1]+=(p[1]-a[1])/d*(1+t/4000);if(d<18){g=2;best=Math.max(best,score)}}if(Math.hypot(p[0]-gem[0],p[1]-gem[1])<23){score+=10;gem=[r(),r()];en=en.filter(a=>Math.hypot(p[0]-a[0],p[1]-a[1])>125);x.fillStyle='#26ffe333';x.beginPath();x.arc(...p,125,0,7);x.fill()}}for(a of en)dot(...a,9,'#ff3972');dot(...gem,8+2*Math.sin(t/12),'#48ffe0');dot(...p,10,'#70aaff');dot(...p,4,'white');text('NEON DRIFT   '+score,30);if(g){x.fillStyle='#050918dd';x.fillRect(30,180,540,240);text(g==2?'SIGNAL LOST':'NEON DRIFT',240,38);text(g==2?'SCORE '+score+'   BEST '+best:'COLLECT ENERGY. OUTRUN THE SWARM.',290,18);text('WASD / ARROWS to drift',330,18);text('Energy clears nearby enemies',360,17);text('SPACE to '+(g==2?'restart':'launch'),397,20)}}loop()
